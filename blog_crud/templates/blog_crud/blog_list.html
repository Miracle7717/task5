<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Управление статьями</title>
  </head>
  <body>
    <main>
      <h1>Управление статьями</h1>
      <p><a href="{% url 'blog_crud:blog_create' %}">Создать статью</a></p>
      <ul>
        {% for blog in blogs %}
          <li>
            <a href="{% url 'blog_crud:blog_detail' blog.pk %}">{{ blog.title }}</a>
            <a href="{% url 'blog_crud:blog_update' blog.pk %}">Изменить</a>
            <a href="{% url 'blog_crud:blog_delete' blog.pk %}">Удалить</a>
          </li>
        {% empty %}
          <li>Статей пока нет.</li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
